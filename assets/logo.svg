<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Pure black background -->
  <rect width="500" height="500" fill="#000000" />
  
  <!-- Minimalist white geometric symbol: two interconnected, branching continuous paths -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- First continuous branching path -->
    <path d="M 150 100 L 250 200 L 250 350 L 150 450" />
    <path d="M 250 200 L 350 100" />

    <!-- Second continuous interconnected branching path -->
    <path d="M 350 400 L 250 300 L 250 150 L 350 50" />
    <path d="M 250 300 L 150 400" />
    
    <!-- Central geometric node connections -->
    <circle cx="250" cy="200" r="16" fill="#FFFFFF" stroke="none" />
    <circle cx="250" cy="300" r="16" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
